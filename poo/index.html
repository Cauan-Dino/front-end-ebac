<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Estacionamento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <h1>🅿️ Calculadora de Estacionamento</h1>
        <p class="subtitulo">Informe o valor pago para saber o tempo liberado e o troco</p>

        <form id="form-estacionamento">
            <label for="valor">Valor inserido (R$)</label>
            <input
                type="number"
                id="valor"
                name="valor"
                step="0.01"
                min="0"
                placeholder="Ex: 5.00"
                required
            >
            <button type="submit">Calcular</button>
        </form>

        <div id="resultado" class="resultado" hidden></div>

        <section class="tabela-precos">
            <h2>Tabela de valores</h2>
            <table id="tabela-faixas">
                <thead>
                    <tr>
                        <th>Valor pago</th>
                        <th>Tempo liberado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script src="js/app.js" type="module"></script>
</body>
</html>
