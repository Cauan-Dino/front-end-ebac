<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de usuário — Correspondência</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="sheet">

    <header class="sheet__header">
      <div class="postmark">
        <span class="postmark__ring"></span>
        <span class="postmark__text">
          <span>CADASTRO</span>
          <span>Nº 01</span>
        </span>
      </div>
      <div class="heading">
        <p class="heading__eyebrow" id="statusLine">preencha os dados abaixo</p>
        <h1>Ficha de cadastro</h1>
        <p class="heading__sub">Informe seu CEP e o endereço se completa sozinho. Tudo fica salvo neste dispositivo, mesmo se a página recarregar.</p>
      </div>
      <div class="stamp" id="stamp" aria-hidden="true">
        <span class="stamp__value">selo</span>
      </div>
    </header>

    <form id="cadastroForm" autocomplete="off" novalidate>

      <fieldset class="group">
        <legend>Dados pessoais</legend>

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Maria da Silva" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="maria@email.com" required>
          </div>
          <div class="field">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(98) 90000-0000">
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Endereço</legend>

        <div class="field field--cep">
          <label for="cep">CEP</label>
          <div class="cep-input">
            <input type="text" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" required>
            <span class="cep-input__status" id="cepStatus"></span>
          </div>
          <p class="field__hint" id="cepHint">Digite os 8 números — o resto preenchemos nós.</p>
        </div>

        <div class="field">
          <label for="logradouro">Rua / Logradouro</label>
          <input type="text" id="logradouro" name="logradouro" placeholder="Preenchido automaticamente" readonly>
        </div>

        <div class="field-row">
          <div class="field field--small">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" placeholder="123" inputmode="numeric">
          </div>
          <div class="field">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, ponto de referência">
          </div>
        </div>

        <div class="field">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" placeholder="Preenchido automaticamente" readonly>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Preenchido automaticamente" readonly>
          </div>
          <div class="field field--small">
            <label for="uf">UF</label>
            <input type="text" id="uf" name="uf" placeholder="—" readonly>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" id="clearBtn" class="btn btn--ghost">Limpar ficha</button>
        <button type="submit" class="btn btn--primary">Salvar cadastro</button>
      </div>

      <p class="save-indicator" id="saveIndicator" aria-live="polite">&nbsp;</p>
    </form>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
