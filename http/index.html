<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes — CRUD com CrudCrud</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Clientes</h1>
      <p>Cadastre, visualize e remova clientes usando a API do CrudCrud.</p>
    </header>

    <section class="form-section">
      <form id="form-cliente">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Ex: maria@email.com" required>
        </div>
        <button type="submit">Cadastrar cliente</button>
      </form>
      <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </section>

    <section class="lista-section">
      <div class="lista-header">
        <h2>Clientes cadastrados</h2>
        <button id="btn-atualizar" type="button">Atualizar lista</button>
      </div>
      <ul id="lista-clientes" class="lista-clientes"></ul>
      <p id="lista-vazia" class="lista-vazia" hidden>Nenhum cliente cadastrado ainda.</p>
    </section>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
